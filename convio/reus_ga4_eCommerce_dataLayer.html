<script type="text/javascript">
// <![CDATA[
/*!
 * GTM/GA4 eCommerce purchase event for standard Luminate Online GA4 items array.
 * Install on Donation Pagewrappers
 *
 * author: Sara Hoffman
 * version: 1.0
 * date: 2025-09-08
 *
 * @link https://salsusdesigns.com
 */
  
// Amount parsing
var giftAmountRaw = '[[S120:dc:giftAmount]]';
var giftAmountSanitized = giftAmountRaw.replace(/[^0-9.\-]/g, '');
var giftAmount = parseFloat(giftAmountSanitized);

// Frequency
var giftDuration = '[[S120:dc:recurringFrequencyLabel]]';
if (giftDuration === '' || giftDuration === null || giftDuration === undefined) {
  giftDuration = 'One time';
}

/* Transaction + metadata, customizable to fundraising program needs
 * See Application ID reference for S4: https://webfiles-sc1.blackbaud.com/files/support/helpfiles/lo/content/s_tags_s4_s11_application_ids.html
 * See S120 reference: https://webfiles-sc1.blackbaud.com/files/support/helpfiles/lo/content/s_tags_thank_you_pages.html
 * Note: There are some different values available for donations2, teamraiser, etc. they can be customized further knowing the Application ID
*/
var transactionId = '[[S120:dc:transactionID]]';
var donationFormName = '[[T6:[[S120:dc:donationFormName]]]]';
var donationFormId = '[[S120:dc:donFormId]]';
var campaignName = '[[T6:[[S120:dc:campaignName]]]]';
var donationAffiliation = "[[T6:[[?x9x::x[[S4]]x::Luminate Donations2::[[?x1x6x::x[[S4]]x::Luminate Ecommerce::Luminate Online::]]]]]]";

// Page name logic (API form fallback to df_id)
// S334 reference: https://webfiles-sc1.blackbaud.com/files/support/helpfiles/lo/content/s_tags_s334_renders_http_query_data.html
var srcPagename = '[[S334:src_pagename]]';
var dfId = '[[S334:df_id]]';
var pageName = (srcPagename === '') ? dfId : srcPagename;

// Source code logic
var sSrc = '[[S334:s_src]]';
var category = (sSrc === '') ? '' : sSrc;

// GA4 ecommerce dataLayer push
dataLayer.push({
  'event': 'purchase',
  'ecommerce': {
    'transaction_id': transactionId,
    'affiliation': donationAffiliation,
    'value': giftAmount,
    'tax': 0,
    'shipping': 0,
    'currency': 'USD',
    'items': [{
      'item_name': donationFormName + ' (' + donationFormId + ')',
      'item_id': donationFormId,
      'price': giftAmount,
      'quantity': 1,
      'item_brand': campaignName,
      'item_variant': giftDuration,
      'item_category': category,
      'item_name': pageName
    }]
  }
});
